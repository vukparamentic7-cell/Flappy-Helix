<!DOCTYPE html>
<html>
<head>
    <title>Flappy Helix</title>
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; margin: 0; padding-top: 20px; }
        canvas { background-color: #70c5ce; display: block; margin: 0 auto; border: 4px solid #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: pointer; }
    </style>
</head>
<body>
    <h1>Flappy Helix</h1>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let bird = { x: 50, y: 150, width: 20, height: 20, gravity: 0.6, lift: -10, velocity: 0 };
        let pipes = [];
        let score = 0;
        let highScore = localStorage.getItem("flappyHighScore") || 0;
        let gameOver = false;
        let frameCount = 0;

        const groundHeight = 50; // Visina trave na dnu

        document.addEventListener("click", () => {
            if (gameOver) {
                resetGame();
            } else {
                bird.velocity = bird.lift;
            }
        });

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            gameOver = false;
            frameCount = 0;
        }

        function spawnPipe() {
            let gap = 120; 
            let minHeight = 40;
            let maxHeight = canvas.height - groundHeight - gap - 40;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - gap,
                width: 50,
                passed: false
            });
        }

        function update() {
            if (gameOver) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // Udari u plafon (vrh)
            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            // Sletanje na travu (dno) - NEMA UMIRANJA, samo stane na travu
            let floorLevel = canvas.height - groundHeight - bird.height;
            if (bird.y > floorLevel) {
                bird.y = floorLevel;
                bird.velocity = 0; 
            }

            // Stvaranje stubova na svakih 90 frejmova
            if (frameCount % 90 === 0) {
                spawnPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2; // Brzina kretanja stubova

                // Sudar sa stubovima (Jedini uzrok smrti!)
                if (
                    bird.x < pipes[i].x + pipes[i].width &&
                    bird.x + bird.width > pipes[i].x &&
                    (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
                ) {
                    gameOver = true;
                    // Provera i čuvanje High Score-a
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("flappyHighScore", highScore);
                    }
                }

                // Dodavanje poena kad prođeš stub
                if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                    score++;
                    pipes[i].passed = true;
                }

                // Brisanje stubova koji su izašli sa ekrana
                if (pipes[i].x + pipes[i].width < 0) {
                    pipes.splice(i, 1);
                }
            }

            frameCount++;
        }

        function draw() {
            // Pozadina (nebo)
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Crtanje stubova
            ctx.fillStyle = "#73bf2e";
            for (let pipe of pipes) {
                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top); 
                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom); 
            }

            // CRTANJE TRAVE NA DNU
            ctx.fillStyle = "#388E3C"; 
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            ctx.fillStyle = "#4CAF50"; 
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);

            // Crtanje ptice/kockice
            ctx.fillStyle = "#f8e71c";
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

            // Crtanje poena i High Score-a
            ctx.fillStyle = "white";
            ctx.font = "20px sans-serif";
            ctx.fillText("Poeni: " + score, 20, 35);
            ctx.fillText("Najbolji: " + highScore, 20, 65);

            // Ekran za Kraj Igre
            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff4d4d";
                ctx.font = "28px sans-serif";
                ctx.fillText("UDARIO U STUB!", 50, 180);

                ctx.fillStyle = "white";
                ctx.font = "20px sans-serif";
                ctx.fillText("Tvoji poeni: " + score, 100, 220);
                ctx.fillText("Najbolji rezultat: " + highScore, 75, 250);

                ctx.font = "16px sans-serif";
                ctx.fillText("Klikni mišem da pokušaš ponovo", 35, 300);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
