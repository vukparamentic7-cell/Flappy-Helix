<!DOCTYPE html>
<html>
<head>
    <title>Flappy Helix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { text-align: center; background-color: #222; color: white; font-family: sans-serif; margin: 0; padding-top: 20px; }
        canvas { background-color: #70c5ce; display: block; margin: 0 auto; border: 4px solid #fff; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: pointer; touch-action: manipulation; }
    </style>
</head>
<body>
    <h1>Flappy Helix</h1>
    <canvas id="gameCanvas" width="320" height="480"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let bird = { 
            x: 50, 
            y: 150, 
            width: 28, 
            height: 22, 
            gravity: 0.6, 
            lift: -10, 
            velocity: 0,
            rotation: 0 
        };
        let pipes = [];
        let score = 0;
        let highScore = localStorage.getItem("flappyHighScore") || 0;
        let gameOver = false;
        let frameCount = 0;

        const groundHeight = 50;

        function triggerAction(e) {
            e.preventDefault();
            if (gameOver) {
                resetGame();
            } else {
                bird.velocity = bird.lift;
            }
        }

        document.addEventListener("click", triggerAction);
        canvas.addEventListener("touchstart", triggerAction, { passive: false });

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            gameOver = false;
            frameCount = 0;
        }

        function spawnPipe() {
            let gap = 120; 
            let minHeight = 40;
            let maxHeight = canvas.height - groundHeight - gap - 40;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - gap,
                width: 50,
                passed: false
            });
        }

        function update() {
            if (gameOver) return;

            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity / 10)));

            if (bird.y < 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            let floorLevel = canvas.height - groundHeight - bird.height;
            if (bird.y > floorLevel) {
                bird.y = floorLevel;
                bird.velocity = 0;
                bird.rotation = 0;
            }

            if (frameCount % 90 === 0) {
                spawnPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2;

                if (
                    bird.x < pipes[i].x + pipes[i].width &&
                    bird.x + bird.width > pipes[i].x &&
                    (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
                ) {
                    gameOver = true;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem("flappyHighScore", highScore);
                    }
                }

                if (!pipes[i].passed && pipes[i].x + pipes[i].width < bird.x) {
                    score++;
                    pipes[i].passed = true;
                }

                if (pipes[i].x + pipes[i].width < 0) {
                    pipes.splice(i, 1);
                }
            }

            frameCount++;
        }

        function draw() {
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let pipe of pipes) {
                let pipeGradient = ctx.createLinearGradient(pipe.x, 0, pipe.x + pipe.width, 0);
                pipeGradient.addColorStop(0, "#8ED142");
                pipeGradient.addColorStop(0.3, "#73BF2E");
                pipeGradient.addColorStop(0.7, "#558022");
                pipeGradient.addColorStop(1, "#364D14");

                ctx.fillStyle = pipeGradient;

                ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.fillRect(pipe.x - 4, pipe.top - 24, pipe.width + 8, 24);

                ctx.fillRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
                ctx.fillRect(pipe.x - 4, canvas.height - pipe.bottom, pipe.width + 8, 24);

                ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
                ctx.fillRect(pipe.x + 4, 0, 4, pipe.top - 24);
                ctx.fillRect(pipe.x + 4, canvas.height - pipe.bottom + 24, 4, pipe.bottom - 24);

                ctx.strokeStyle = "#1A260A";
                ctx.lineWidth = 2;
                ctx.strokeRect(pipe.x, 0, pipe.width, pipe.top);
                ctx.strokeRect(pipe.x - 4, pipe.top - 24, pipe.width + 8, 24);
                ctx.strokeRect(pipe.x, canvas.height - pipe.bottom, pipe.width, pipe.bottom);
                ctx.strokeRect(pipe.x - 4, canvas.height - pipe.bottom, pipe.width + 8, 24);
            }

            ctx.fillStyle = "#388E3C"; 
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
            ctx.fillStyle = "#4CAF50"; 
            ctx.fillRect(0, canvas.height - groundHeight, canvas.width, 10);

            ctx.save();
            ctx.translate(bird.x + bird.width / 2, bird.y + bird.height / 2);
            ctx.rotate(bird.rotation);

            ctx.fillStyle = "#f8e71c";
            ctx.beginPath();
            ctx.ellipse(0, 0, bird.width / 2, bird.height / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#b39b00";
            ctx.stroke();

            ctx.fillStyle = "#f5a623";
            ctx.beginPath();
            ctx.ellipse(-4, 3, 8, 5, 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(6, -4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(7, -4, 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#f57c00";
            ctx.beginPath();
            ctx.moveTo(12, -3);
            ctx.lineTo(20, 0);
            ctx.lineTo(12, 3);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            ctx.fillStyle = "white";
            ctx.font = "20px sans-serif";
            ctx.fillText("Poeni: " + score, 20, 35);
            ctx.fillText("Najbolji: " + highScore, 20, 65);

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff4d4d";
                ctx.font = "28px sans-serif";
                ctx.fillText("UDARIO U STUB!", 50, 180);

                ctx.fillStyle = "white";
                ctx.font = "20px sans-serif";
                ctx.fillText("Tvoji poeni: " + score, 100, 220);
                ctx.fillText("Najbolji rezultat: " + highScore, 75, 250);

                ctx.font = "16px sans-serif";
                ctx.fillText("Klikni mišem da pokušaš ponovo", 35, 300);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
